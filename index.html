<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Correa | Antares Group S.A.</title>
  <!-- Respaldo tipográfico para dispositivos móviles que no incluyen Baskerville Old Face de serie -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0c2340;
      --antares-red: rgb(148, 54, 52); /* #943634 */
      --whatsapp: #22a147;
      --btn-grey: #84888e;
      --btn-light: #e2e5e9;
      --tag-bg: #e1effe;
      --tag-text: #1e429f;
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
    }
    .card {
      background: var(--card);
      max-width: 390px;
      width: 100%;
      border-radius: 26px;
      box-shadow: 0 15px 35px rgba(12, 35, 64, 0.14);
      overflow: hidden;
      text-align: center;
      padding-bottom: 24px;
      position: relative;
    }
    .header {
      background-color: var(--navy);
      height: 130px;
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 16px 18px;
    }
    .lang-switch {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.85);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: #ffffff;
      color: var(--navy);
    }
    .avatar-container {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      margin: -59px auto 0;
      background: #f6f6f6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      padding: 10px;
    }
    .avatar-container img,
    .avatar-container svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .profile-info { padding: 14px 22px 6px; }
    h1 { margin: 0 0 4px; font-size: 1.55rem; font-weight: 800; color: #000000; }
    .role { margin: 0; color: var(--muted); font-size: 0.96rem; font-weight: 500; }
    .company {
      margin: 5px 0 12px;
      color: var(--antares-red);
      font-family: "Baskerville Old Face", "Baskerville", "Libre Baskerville", Georgia, serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.3px;
    }
    .bio {
      font-size: 0.82rem;
      color: #374151;
      line-height: 1.42;
      margin: 0 0 14px;
      padding: 0 4px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 0 8px;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.74rem;
      padding: 5px 11px;
      border-radius: 8px;
      font-weight: 600;
    }
    .actions { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 10px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.12s, opacity 0.2s;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary {
      background: var(--navy);
      color: #ffffff;
      font-size: 0.95rem;
      padding: 14px;
    }
    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      padding: 10px 8px;
    }
    .btn-call {
      background: var(--btn-grey);
      color: #ffffff;
      padding: 12px 10px;
    }
    .btn-light {
      background: var(--btn-light);
      color: #111827;
      padding: 12px 10px;
    }
    .sub-label {
      font-size: 0.68rem;
      opacity: 0.95;
      font-weight: 400;
      display: block;
      margin-top: 2px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qr-box {
      display: none;
      margin: 16px 20px 0;
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 12px rgba(12, 35, 64, 0.06);
      animation: fadeIn 0.25s ease-in-out;
    }
    .qr-box.visible {
      display: block;
    }
    .qr-box img {
      width: 220px;
      height: 220px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .qr-caption { font-size: 0.75rem; color: var(--muted); margin: 10px 0 0; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('es', this)">ES</button>
      <button class="lang-btn" onclick="setLang('it', this)">IT</button>
      <button class="lang-btn" onclick="setLang('en', this)">EN</button>
    </div>
  </div>

  <!-- Logotipo vectorial de Antares Group S.A. incrustado directamente -->
  <div class="avatar-container" id="avatarBox">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="1200"
      height="780"
      viewBox="0 0 1200 780"
      fill="none"
    >
      <title>Logotipo Antares con acabado metálico</title>
      <desc>
        Reconstrucción vectorial de cuatro piezas curvas,
        con fondo transparente, degradados grises y reflejos.
      </desc>

      <defs>
        <linearGradient id="metal-superior" gradientUnits="userSpaceOnUse" x1="750" y1="52" x2="779" y2="230">
          <stop offset="0" stop-color="#292929"/>
          <stop offset=".13" stop-color="#555555"/>
          <stop offset=".31" stop-color="#999999"/>
          <stop offset=".43" stop-color="#a9a9a9"/>
          <stop offset=".57" stop-color="#7c7c7c"/>
          <stop offset=".78" stop-color="#555555"/>
          <stop offset=".93" stop-color="#303030"/>
          <stop offset="1" stop-color="#171717"/>
        </linearGradient>

        <linearGradient id="metal-izquierda" gradientUnits="userSpaceOnUse" x1="248" y1="329" x2="421" y2="360">
          <stop offset="0" stop-color="#202020"/>
          <stop offset=".17" stop-color="#474747"/>
          <stop offset=".44" stop-color="#797979"/>
          <stop offset=".66" stop-color="#999999"/>
          <stop offset=".81" stop-color="#c4c4c4"/>
          <stop offset=".90" stop-color="#ababab"/>
          <stop offset="1" stop-color="#414141"/>
        </linearGradient>

        <linearGradient id="metal-derecha" gradientUnits="userSpaceOnUse" x1="777" y1="368" x2="933" y2="450">
          <stop offset="0" stop-color="#252525"/>
          <stop offset=".16" stop-color="#4e4e4e"/>
          <stop offset=".43" stop-color="#777777"/>
          <stop offset=".64" stop-color="#969696"/>
          <stop offset=".81" stop-color="#aeaeae"/>
          <stop offset="1" stop-color="#393939"/>
        </linearGradient>

        <linearGradient id="metal-inferior" gradientUnits="userSpaceOnUse" x1="452" y1="559" x2="425" y2="704">
          <stop offset="0" stop-color="#3a3a3a"/>
          <stop offset=".17" stop-color="#858585"/>
          <stop offset=".31" stop-color="#bcbcbc"/>
          <stop offset=".45" stop-color="#8b8b8b"/>
          <stop offset=".67" stop-color="#676767"/>
          <stop offset=".86" stop-color="#414141"/>
          <stop offset="1" stop-color="#191919"/>
        </linearGradient>

        <radialGradient id="luz-superior" gradientUnits="userSpaceOnUse" cx="399" cy="64" r="135" gradientTransform="translate(399 64) scale(1 .48) translate(-399 -64)">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
          <stop offset=".42" stop-color="#eeeeee" stop-opacity=".23"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>

        <path id="pieza-superior" d="M 362,44 L 386,26 C 489,79 581,123 708,120 C 855,119 1031,62 1180,11 L 1190,29 C 1064,111 870,184 674,239 C 554,193 455,139 395,66 C 386,54 379,57 377,71 Z" />
        <path id="pieza-izquierda" d="M 362,44 L 386,26 C 378,96 392,155 411,217 C 434,285 440,343 431,394 C 350,475 222,594 66,726 C 56,734 58,738 71,732 L 29,763 L 20,772 L 11,755 C 139,613 262,467 318,350 C 354,266 366,156 362,44 Z" />
        <path id="pieza-derecha" d="M 1180,11 L 1191,29 C 1075,165 969,292 900,431 C 850,532 835,635 840,741 L 816,755 L 800,731 C 771,667 758,586 765,476 L 770,389 C 858,284 1008,144 1135,53 C 1144,46 1138,43 1128,48 Z" />
        <path id="pieza-inferior" d="M 11,755 C 175,663 354,586 526,544 C 658,587 749,647 807,718 C 815,729 823,730 829,718 L 840,741 L 816,755 C 697,688 605,659 503,660 C 361,658 187,717 20,772 Z" />

        <clipPath id="recorte-superior"><use href="#pieza-superior"/></clipPath>
        <clipPath id="recorte-izquierda"><use href="#pieza-izquierda"/></clipPath>
        <clipPath id="recorte-derecha"><use href="#pieza-derecha"/></clipPath>
        <clipPath id="recorte-inferior"><use href="#pieza-inferior"/></clipPath>

        <filter id="reflejo-suave" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
        <filter id="borde-suave" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
      </defs>

      <g stroke="#363636" stroke-width="1.4" stroke-linejoin="round">
        <use href="#pieza-superior" fill="url(#metal-superior)"/>
        <use href="#pieza-izquierda" fill="url(#metal-izquierda)"/>
        <use href="#pieza-derecha" fill="url(#metal-derecha)"/>
        <use href="#pieza-inferior" fill="url(#metal-inferior)"/>
      </g>

      <g clip-path="url(#recorte-superior)">
        <path d="M 391,49 C 561,171 734,201 1149,39" stroke="#e2e2e2" stroke-width="14" opacity=".29" filter="url(#reflejo-suave)" />
        <path d="M 399,71 C 472,145 566,196 675,228 C 859,177 1042,106 1134,51" stroke="#d4d4d4" stroke-width="3" opacity=".43" filter="url(#borde-suave)" />
        <rect x="355" y="25" width="270" height="150" fill="url(#luz-superior)" />
        <path d="M 403,77 C 469,155 567,207 674,237" stroke="#111111" stroke-width="6" opacity=".62" filter="url(#borde-suave)" />
      </g>

      <g clip-path="url(#recorte-izquierda)">
        <path d="M 389,72 C 403,154 431,249 420,378 C 325,478 201,599 66,722" stroke="#eeeeee" stroke-width="13" opacity=".63" filter="url(#reflejo-suave)" />
        <path d="M 371,69 C 379,211 350,325 294,418 C 224,533 124,650 33,751" stroke="#171717" stroke-width="9" opacity=".65" filter="url(#reflejo-suave)" />
        <path d="M 398,89 C 419,193 437,297 425,389 C 336,481 208,601 67,726" stroke="#ededed" stroke-width="2.5" opacity=".48" filter="url(#borde-suave)" />
        <path d="M 24,753 L 62,727" stroke="#eeeeee" stroke-width="4" opacity=".6" filter="url(#borde-suave)" />
      </g>

      <g clip-path="url(#recorte-derecha)">
        <path d="M 1158,43 C 1029,170 906,323 846,484 C 819,558 811,647 820,713" stroke="#c9c9c9" stroke-width="15" opacity=".44" filter="url(#reflejo-suave)" />
        <path d="M 1136,54 C 1009,150 868,286 779,394 C 766,521 775,638 809,715" stroke="#181818" stroke-width="9" opacity=".7" filter="url(#reflejo-suave)" />
        <path d="M 1134,49 C 1001,150 856,291 776,391" stroke="#d6d6d6" stroke-width="2.5" opacity=".52" filter="url(#borde-suave)" />
        <path d="M 827,719 C 816,639 825,548 854,473" stroke="#ededed" stroke-width="3" opacity=".55" filter="url(#borde-suave)" />
        <path d="M 1161,28 L 1180,21" stroke="#ffffff" stroke-width="7" opacity=".65" filter="url(#reflejo-suave)" />
      </g>

      <g clip-path="url(#recorte-inferior)">
        <path d="M 72,730 C 249,655 399,597 525,560 C 645,600 739,658 802,721" stroke="#e4e4e4" stroke-width="13" opacity=".48" filter="url(#reflejo-suave)" />
        <path d="M 531,557 C 653,600 741,661 803,721" stroke="#f1f1f1" stroke-width="9" opacity=".58" filter="url(#reflejo-suave)" />
        <path d="M 57,747 C 237,690 385,646 503,650 C 619,649 711,687 807,740" stroke="#151515" stroke-width="10" opacity=".65" filter="url(#reflejo-suave)" />
        <path d="M 69,732 C 247,659 400,603 525,566" stroke="#c9c9c9" stroke-width="2.5" opacity=".46" filter="url(#borde-suave)" />
        <path d="M 29,756 C 205,702 379,650 503,656 C 619,653 720,694 812,745" stroke="#aaaaaa" stroke-width="2" opacity=".38" filter="url(#borde-suave)" />
      </g>
    </svg>
  </div>

  <div class="profile-info">
    <h1 id="ui-name">Juan Correa</h1>
    <p class="role" id="ui-role">Director</p>
    <p class="company" id="ui-company">Antares Group S.A.</p>
    <p class="bio" id="ui-bio"></p>

    <div class="tags" id="ui-tags"></div>
  </div>

  <div class="actions">
    <!-- Guardar en Contactos -->
    <button class="btn btn-primary" onclick="descargarVCard()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="lbl-save">Guardar en Contactos</span>
    </button>

    <!-- WhatsApp ES & CL -->
    <div class="grid-2">
      <a class="btn btn-whatsapp" id="link-wa-es" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <div>WhatsApp ES<span class="sub-label">+34 651 077 555</span></div>
      </a>
      <a class="btn btn-whatsapp" id="link-wa-cl" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <div>WhatsApp CL<span class="sub-label">+56 9 7589 7064</span></div>
      </a>
    </div>

    <!-- Llamar ES & CL -->
    <div class="grid-2">
      <a class="btn btn-call" id="link-tel-es" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
        </svg>
        <span id="lbl-call-es">Llamar ES</span>
      </a>
      <a class="btn btn-call" id="link-tel-cl" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
        </svg>
        <span id="lbl-call-cl">Llamar CL</span>
      </a>
    </div>

    <!-- Email & Web Antares -->
    <div class="grid-2">
      <a class="btn btn-light" id="link-mail" href="#">
        <svg viewBox="0 0 24 24" fill="#1e293b">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <span>Email</span>
      </a>
      <a class="btn btn-light" id="link-web" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="lbl-web">Web Antares</span>
      </a>
    </div>

    <!-- Mostrar Código QR -->
    <button class="btn btn-light" onclick="toggleQR()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
      <span id="lbl-qr">Mostrar Código QR</span>
    </button>
  </div>

  <!-- Contenedor del Código QR -->
  <div class="qr-box" id="qrBox">
    <img id="qrImg" src="Code_Generated_Image.png" alt="Código QR de Contacto" onerror="cargarQRRespaldo()">
    <p class="qr-caption" id="lbl-qr-Sub">Escanea para guardar mi contacto directamente</p>
  </div>
</div>

<script>
const DATOS = {
  nombre: "Juan",
  apellido: "Correa",
  empresa: "Antares Group S.A.",
  telES: "+34651077555",
  waES: "34651077555",
  telCL: "+56975897064",
  waCL: "56975897064",
  email: "juan@antaresgroup.cl",
  web: "https://www.antaresgroup.cl",
  mercados: "Chile · Perú · Europa"
};

const TEXTOS = {
  es: {
    role: "Director",
    bio: "Soluciones de ingeniería de procesos, automatización industrial, I+D y optimización con IA para la industria enológica, destilados y bebidas.",
    tags: ["Ingeniería de Procesos", "Automatización & IA", "Tecnología", "Vino & Bebidas"],
    save: "Guardar en Contactos",
    callES: "Llamar ES",
    callCL: "Llamar CL",
    web: "Web Antares",
    qr: "Mostrar Código QR",
    qrHide: "Ocultar Código QR",
    qrSub: "Escanea para guardar mi contacto directamente"
  },
  it: {
    role: "Direttore / Director",
    bio: "Soluzioni di ingegneria di processo, automazione industriale, R&S e ottimizzazione AI per l'industria enologica, distillati e bevande.",
    tags: ["Ingegneria di Processo", "Automazione & AI", "Tecnologia", "Enologia & Beverage"],
    save: "Salva nei Contatti",
    callES: "Chiama ES",
    callCL: "Chiama CL",
    web: "Sito Web",
    qr: "Mostra Codice QR",
    qrHide: "Nascondi Codice QR",
    qrSub: "Scansiona per salvare il contatto in rubrica"
  },
  en: {
    role: "Director",
    bio: "Process engineering, industrial automation, R&D and AI-driven optimization for the wine, spirits, and beverage industry.",
    tags: ["Process Engineering", "Automation & AI", "Technology", "Wine & Beverage"],
    save: "Save to Contacts",
    callES: "Call ES",
    callCL: "Call CL",
    web: "Website",
    qr: "Show QR Code",
    qrHide: "Hide QR Code",
    qrSub: "Scan to save contact directly to your phone"
  }
};

let idiomaActual = 'es';
let usandoRespaldoQR = false;

function inicializar() {
  document.getElementById("ui-name").textContent = `${DATOS.nombre} ${DATOS.apellido}`;
  document.getElementById("ui-company").textContent = DATOS.empresa;

  document.getElementById("link-wa-es").href = `https://wa.me/${DATOS.waES}`;
  document.getElementById("link-wa-cl").href = `https://wa.me/${DATOS.waCL}`;
  document.getElementById("link-tel-es").href = `tel:${DATOS.telES}`;
  document.getElementById("link-tel-cl").href = `tel:${DATOS.telCL}`;
  document.getElementById("link-mail").href = `mailto:${DATOS.email}`;
  document.getElementById("link-web").href = DATOS.web;

  renderIdioma('es');
}

function setLang(lang, btn) {
  idiomaActual = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderIdioma(lang);
  if (usandoRespaldoQR && document.getElementById("qrBox").classList.contains("visible")) {
    cargarQRRespaldo();
  }
}

function renderIdioma(lang) {
  const t = TEXTOS[lang];
  const qrVisible = document.getElementById("qrBox").classList.contains("visible");
  document.getElementById("ui-role").textContent = t.role;
  document.getElementById("ui-bio").textContent = t.bio;
  document.getElementById("lbl-save").textContent = t.save;
  document.getElementById("lbl-call-es").textContent = t.callES;
  document.getElementById("lbl-call-cl").textContent = t.callCL;
  document.getElementById("lbl-web").textContent = t.web;
  document.getElementById("lbl-qr").textContent = qrVisible ? t.qrHide : t.qr;
  document.getElementById("lbl-qr-Sub").textContent = t.qrSub;

  const tagsContainer = document.getElementById("ui-tags");
  tagsContainer.innerHTML = t.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
}

function generarTextoVCard() {
  const t = TEXTOS[idiomaActual];
  return [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${DATOS.apellido};${DATOS.nombre};;;`,
    `FN:${DATOS.nombre} ${DATOS.apellido}`,
    `ORG:${DATOS.empresa}`,
    `TITLE:${t.role}`,
    `TEL;TYPE=CELL,VOICE,PREF:${DATOS.telES}`,
    `TEL;TYPE=CELL,VOICE:${DATOS.telCL}`,
    `EMAIL;TYPE=WORK,INTERNET:${DATOS.email}`,
    `URL:${DATOS.web}`,
    `NOTE:${t.bio} (${DATOS.mercados})`,
    "END:VCARD"
  ].join("\n");
}

function descargarVCard() {
  const vcard = generarTextoVCard();
  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Juan_Correa_Antares_Group.vcf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Respaldo automático en color azul marino (#0c2340) si Code_Generated_Image.png no se encuentra en la misma carpeta
function cargarQRRespaldo() {
  usandoRespaldoQR = true;
  const img = document.getElementById("qrImg");
  img.onerror = null;
  const vcardData = encodeURIComponent(generarTextoVCard());
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&color=0c2340&data=${vcardData}`;
}

function toggleQR() {
  const box = document.getElementById("qrBox");
  const lbl = document.getElementById("lbl-qr");
  const t = TEXTOS[idiomaActual];

  if (box.classList.contains("visible")) {
    box.classList.remove("visible");
    lbl.textContent = t.qr;
  } else {
    box.classList.add("visible");
    lbl.textContent = t.qrHide;
    setTimeout(() => {
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 50);
  }
}

inicializar();
</script>
